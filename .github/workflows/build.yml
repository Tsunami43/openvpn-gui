name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the x86_64 package to (e.g. v0.2.0)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git github-cli \
            qt6-base qt6-declarative qt6-svg qt6-wayland \
            xdg-desktop-portal openvpn polkit libsecret

      - uses: actions/checkout@v5

      - name: Test
        run: bin/test

      - name: Build package
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/pkgbuild' && makepkg -f --nodeps"

      - uses: actions/upload-artifact@v6
        with:
          name: openvpn-gui-x86_64
          path: pkgbuild/*.pkg.tar.*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "OpenVPN GUI ${TAG#v}" --generate-notes
          gh release upload "$TAG" pkgbuild/*.pkg.tar.* --clobber

      # The signed pacman repository lives in the repo-x86_64 pre-release
      # (a pre-release, so the app's update check never takes it for a
      # version). Uploading replaces the database, then packages no longer in
      # it are removed.
      - name: Publish to the pacman repository
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PACMAN_GPG_PRIVATE_KEY: ${{ secrets.PACMAN_GPG_PRIVATE_KEY }}
          GPG_KEY: 69B2A58A0FC6BAF7A541DAD2CD1A2C3155059EFD
          GH_REPO: ${{ github.repository }}
          REPO: repo-x86_64
        run: |
          printf '%s\n' "$PACMAN_GPG_PRIVATE_KEY" | gpg --batch --import
          bin/repo /repo pkgbuild/*.pkg.tar.zst
          gh release view "$REPO" >/dev/null 2>&1 \
            || gh release create "$REPO" --prerelease --target main \
                 --title "pacman repository (x86_64)" \
                 --notes "The signed pacman repository for OpenVPN GUI. See the README for how to add it."
          cd /repo
          gh release upload "$REPO" openvpn-gui.db openvpn-gui.db.sig openvpn-gui.files openvpn-gui.files.sig \
            *.pkg.tar.zst *.pkg.tar.zst.sig --clobber
          gh release view "$REPO" --json assets -q '.assets[].name' | while read -r asset; do
            [ -e "$asset" ] || gh release delete-asset "$REPO" "$asset" --yes
          done

  # Publishes the release to the AUR as openvpn-gui, built from the tag's
  # source. Runs only when the AUR_ENABLED repository variable is "true", and
  # needs the AUR_SSH_PRIVATE_KEY secret, whose public half is on the
  # maintainer's AUR account.
  aur:
    needs: build
    if: vars.AUR_ENABLED == 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '')
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed git openssh pacman-contrib \
            qt6-base qt6-declarative qt6-svg qt6-wayland \
            xdg-desktop-portal openvpn polkit libsecret

      - uses: actions/checkout@v5

      - name: Set the version and build the AUR package
        run: |
          useradd -m builder
          mkdir /aur-build
          cp aur/PKGBUILD /aur-build/
          cd /aur-build
          sed -i "s/^pkgver=.*/pkgver=${TAG#v}/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          chown -R builder .
          su builder -c "updpkgsums && makepkg --printsrcinfo > .SRCINFO && makepkg -f"

      - name: Push to the AUR
        run: |
          test -n "$AUR_SSH_PRIVATE_KEY" || { echo "AUR_SSH_PRIVATE_KEY is not set"; exit 1; }
          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git config --global user.name "Tsunami43"
          git config --global user.email "Tsunami43@users.noreply.github.com"
          git config --global init.defaultBranch master
          git clone ssh://aur@aur.archlinux.org/openvpn-gui.git /aur-repo
          cp /aur-build/PKGBUILD /aur-build/.SRCINFO /aur-repo/
          cd /aur-repo
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "The AUR already has this version."
          else
            git commit -m "Update to ${TAG#v}"
            git push origin HEAD:master
          fi
